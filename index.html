<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amir Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c; --panel:#12141a; --panel2:#181b22; --ink:#eef0f3; --ink-dim:#9aa0aa;
  --line:rgba(255,255,255,.10); --glass:rgba(16,18,24,.72);
  --lume:#5aa7ff; --lume-soft:rgba(90,167,255,.28); --warn:#ffb15a; --bad:#ff6b6b; --good:#6bdc9a;
  --topbar-h:58px; --bottomnav-h:60px; --sheet-radius:20px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);margin:0;overflow-x:hidden;}
body{font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px));}
h1,h2,h3,.wordmark,.price{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;color:inherit;}
::selection{background:var(--lume-soft);}
img{max-width:100%;display:block;}
.hide{display:none!important;}
.container{max-width:1180px;margin:0 auto;padding:0 16px;}
@media(min-width:900px){.container{padding:0 32px;}}

/* ---- buttons ---- */
.btn{font-size:.92rem;font-weight:500;padding:12px 22px;border-radius:100px;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease;touch-action:manipulation;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--ink);color:#0a0a0c;}
.btn.primary:disabled{opacity:.5;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.block{width:100%;display:block;text-align:center;}
.btn.sm{padding:8px 14px;font-size:.8rem;}
.btn.danger{background:rgba(255,107,107,.15);color:var(--bad);border-color:rgba(255,107,107,.3);}
.iconbtn{background:none;border:none;color:var(--ink);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative;touch-action:manipulation;}
.iconbtn:active{background:rgba(255,255,255,.08);}
.iconbtn svg{width:19px;height:19px;}
.badge{position:absolute;top:2px;right:2px;background:var(--lume);color:#04070d;font-size:.62rem;font-weight:700;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---- top bar ---- */
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line);}
.wordmark{font-size:1.05rem;display:flex;align-items:baseline;gap:.15em;white-space:nowrap;}
.wordmark b{font-weight:700;}
.wordmark span{color:var(--ink-dim);font-weight:400;font-size:.9em;}
.tb-actions{display:flex;align-items:center;gap:2px;}
.desktop-links{display:none;list-style:none;margin:0;padding:0;gap:24px;font-size:.86rem;color:var(--ink-dim);}
.desktop-links a{text-decoration:none;}
.desktop-links a:hover{color:var(--ink);}
@media(min-width:860px){.desktop-links{display:flex;}}

/* ---- bottom nav ---- */
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
@media(min-width:860px){#bottomnav{display:none;}body{padding-bottom:0;}}
@media(orientation:landscape) and (max-height:480px){:root{--bottomnav-h:48px;}#bottomnav .bn-label{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--bottomnav-h);background:none;border:none;color:var(--ink-dim);font-size:.66rem;cursor:pointer;touch-action:manipulation;}
.bn-item.active{color:var(--lume);}
.bn-item svg{width:20px;height:20px;}

/* ---- drawers / sheets / overlays ---- */
.scrim{position:fixed;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.scrim.open{opacity:1;pointer-events:auto;}
#cartDrawer{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:var(--panel);z-index:90;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--line);}
#cartDrawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px;}
.drawer-foot{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--panel);border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82vh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none;}
#sheet.open{transform:translateY(0);}
@media(min-width:860px){#sheet{left:auto;width:380px;top:0;bottom:0;border-radius:0;transform:translateX(100%);max-height:none;}#sheet.open{transform:translateX(0);}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 0;}
@media(min-width:860px){.sheet-handle{display:none;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
.sheet-body{overflow-y:auto;padding:16px 18px;flex:1;}
.sheet-foot{display:flex;gap:10px;padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);}
#sheet.side-menu{left:auto;right:0;top:0;bottom:0;width:min(86vw,360px);max-height:none;border-radius:0;border:1px solid var(--line);transform:translateX(100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#sheet.side-menu.open{transform:translateX(0);}
#sheet.side-menu .sheet-handle{display:none;}
#sheet.side-menu .sheet-head{padding-top:20px;}
@media(min-width:860px){#sheet.side-menu{left:auto;right:0;width:380px;}}

#searchOverlay{position:fixed;inset:0;z-index:95;background:var(--bg);transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
#searchOverlay.open{transform:translateY(0);}
.search-head{display:flex;gap:10px;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);}
.search-input-wrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:10px 14px;}
.search-input-wrap input{background:none;border:none;outline:none;font-size:.95rem;width:100%;color:var(--ink);}
.search-body{flex:1;overflow-y:auto;padding:16px;}

#modalRoot{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,5,8,.7);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s ease;}
#modalRoot.open{opacity:1;pointer-events:auto;}
.modalcard{width:min(94vw,460px);max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;}

#toasts{position:fixed;left:0;right:0;bottom:calc(var(--bottomnav-h) + 12px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
@media(min-width:860px){#toasts{bottom:20px;}}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:100px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastin .25s ease;}
.toast.err{border-color:rgba(255,107,107,.4);color:var(--bad);}
.toast.ok{border-color:rgba(107,220,154,.4);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.flyer{position:fixed;z-index:130;width:14px;height:14px;border-radius:50%;background:var(--lume);pointer-events:none;transition:all .55s cubic-bezier(.3,.6,.4,1);}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:.78rem;color:var(--ink-dim);}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.95rem;outline:none;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lume);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-dim);}
.check input{width:18px;height:18px;}
.chipset{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 15px;border-radius:100px;background:var(--panel2);border:1px solid var(--line);font-size:.8rem;color:var(--ink-dim);cursor:pointer;}
.chip.active{background:rgba(90,167,255,.14);color:var(--lume);border-color:rgba(90,167,255,.35);}

/* ---- product grid/card ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:640px){.grid2{grid-template-columns:repeat(3,1fr);gap:16px;}}
@media(min-width:900px){.grid2{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1180px){.grid2{grid-template-columns:repeat(5,1fr);}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s ease,border-color .2s ease;}
.card:active{transform:scale(.98);}
.card .thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.card .thumb .swatch{position:absolute;inset:0;}
.card .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card .thumb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.14),transparent 60%);}
.tag{position:absolute;top:8px;left:8px;font-size:.62rem;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:100px;letter-spacing:.02em;z-index:2;}
.tag.sale{color:var(--warn);}
.tag.new{color:var(--good);}
.wish{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);border:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
.wish svg{width:16px;height:16px;}
.wish.active svg{fill:var(--bad);stroke:var(--bad);}
.card .info{padding:10px 12px 12px;}
.card .brandline{font-size:.68rem;color:var(--ink-dim);margin-bottom:2px;}
.card .name{font-size:.86rem;font-weight:500;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .stars{font-size:.7rem;color:var(--warn);margin-bottom:5px;}
.card .pricerow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.card .pnow{font-weight:600;font-size:.98rem;}
.card .pold{font-size:.75rem;color:var(--ink-dim);text-decoration:line-through;}
.card .pct{font-size:.68rem;color:var(--warn);}
.card .addbtn{width:100%;font-size:.78rem;padding:9px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;color:var(--ink);}
.card .addbtn:active{background:rgba(90,167,255,.15);}
.card .addbtn:disabled{opacity:.4;}
.skeleton{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel) 37%,var(--panel2) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---- misc page bits ---- */
.section{padding:22px 0;}
.section h2.h{font-size:1.3rem;margin:0 0 14px;}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
.catcard{flex:0 0 auto;width:150px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .2s ease;}
.catcard:active{transform:scale(.96);}
.catcard .sw{width:100%;aspect-ratio:1.4/1;border-radius:10px;margin-bottom:10px;}
.catcard .cname{font-size:.85rem;font-weight:500;}
.catcard .ccount{font-size:.7rem;color:var(--ink-dim);}
.banner{padding:30px 0;border-bottom:1px solid var(--line);margin-bottom:18px;}
.crumb{font-size:.78rem;color:var(--ink-dim);margin-bottom:8px;}
.crumb a{text-decoration:none;}
.crumb a:hover{color:var(--ink);}

#viewerWrap{position:relative;width:100%;aspect-ratio:1/1;max-height:56vh;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#141824,#08090c 75%);touch-action:pan-y;max-width:560px;margin-left:auto;margin-right:auto;}
#viewerWrap canvas{width:100%!important;height:100%!important;display:block;}
.hero-viewer{aspect-ratio:auto;height:52vh;min-height:340px;max-height:560px;border-radius:0;}

.stepbar{display:flex;gap:6px;margin-bottom:22px;}
.stepbar .seg{flex:1;height:3px;border-radius:3px;background:var(--line);}
.stepbar .seg.done{background:var(--lume);}
.sticky-buy{position:sticky;bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom,0px));left:0;right:0;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;z-index:40;}
@media(min-width:860px){.sticky-buy{bottom:0;}}

table.dt{width:100%;border-collapse:collapse;font-size:.86rem;}
table.dt th{text-align:left;color:var(--ink-dim);font-weight:500;font-size:.75rem;padding:10px 12px;border-bottom:1px solid var(--line);}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line);}
@media(max-width:760px){
  table.dt thead{display:none;}
  table.dt, table.dt tbody, table.dt tr, table.dt td{display:block;width:100%;}
  table.dt tr{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 4px;}
  table.dt td{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);}
  table.dt td:last-child{border-bottom:none;}
  table.dt td::before{content:attr(data-label);color:var(--ink-dim);font-size:.75rem;}
}
.statcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
.statcard .v{font-size:1.5rem;font-weight:600;}
.statcard .l{font-size:.75rem;color:var(--ink-dim);}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr);}}

#adminShell{display:flex;min-height:100vh;}
#adminSidebar{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0;}
#adminSidebar a{display:block;padding:10px 12px;border-radius:10px;font-size:.88rem;color:var(--ink-dim);text-decoration:none;margin-bottom:2px;}
#adminSidebar a.active,#adminSidebar a:hover{background:var(--panel2);color:var(--ink);}
#adminMain{flex:1;padding:20px;min-width:0;}
@media(max-width:860px){
  #adminSidebar{position:fixed;top:0;bottom:0;left:0;z-index:90;transform:translateX(-100%);transition:transform .25s ease;}
  #adminSidebar.open{transform:translateX(0);}
}
.pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:.72rem;}
.pill.pending{background:rgba(255,177,90,.15);color:var(--warn);}
.pill.confirmed,.pill.paid{background:rgba(90,167,255,.15);color:var(--lume);}
.pill.shipped{background:rgba(154,223,214,.15);color:#9adfd6;}
.pill.delivered{background:rgba(107,220,154,.15);color:var(--good);}
.pill.cancelled,.pill.failed{background:rgba(255,107,107,.15);color:var(--bad);}
.spec-row{display:flex;gap:12px;}
.spec-row input{flex:1;}
.imgprev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.imgprev .th{width:64px;height:64px;border-radius:8px;position:relative;overflow:hidden;}
.imgprev .th img{width:100%;height:100%;object-fit:cover;}
.imgprev .th button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);border:none;color:#fff;width:18px;height:18px;border-radius:50%;font-size:.7rem;cursor:pointer;}
.empty{text-align:center;padding:60px 20px;color:var(--ink-dim);}
.empty .btn{margin-top:14px;}

[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .wordmark,[dir=rtl] .price,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:'IBM Plex Sans Arabic','Inter',sans-serif;}
[dir=rtl] .tag{left:auto;right:8px;}
[dir=rtl] .wish{right:auto;left:6px;}
[dir=rtl] #cartDrawer{right:auto;left:0;transform:translateX(-100%);border-left:none;border-right:1px solid var(--line);}
[dir=rtl] #cartDrawer.open{transform:translateX(0);}
[dir=rtl] #adminSidebar{border-right:none;border-left:1px solid var(--line);}
@media(min-width:860px){[dir=rtl] #sheet{left:0;right:auto;transform:translateX(-100%);}[dir=rtl] #sheet.open{transform:translateX(0);}}
@media(max-width:860px){[dir=rtl] #adminSidebar{left:auto;right:0;transform:translateX(100%);}[dir=rtl] #adminSidebar.open{transform:translateX(0);}}
.langbtn{font-size:.8rem;font-weight:600;}
.photo{aspect-ratio:1/1;max-height:56vh;width:100%;border-radius:18px;overflow:hidden;background:#0d0f14;}
.photo img{width:100%;height:100%;object-fit:contain;}
.thumbs{margin-top:10px;}
.thumbs .th{width:60px;height:60px;cursor:pointer;background:#0d0f14;}
.dropzone{display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-dim);font-size:.85rem;cursor:pointer;}
.dropzone.over{border-color:var(--lume);color:var(--lume);}
.qin{width:88px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:.85rem;outline:none;}
.qin:focus{border-color:var(--lume);}
.rowthumb{width:48px;height:48px;border-radius:8px;flex-shrink:0;}
.tdimg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

body.lock,body.introlock{overflow:hidden;}
body.admin-mode #bottomnav{display:none;}
body.admin-mode{padding-bottom:0;}
.pill.preparing{background:rgba(165,139,255,.15);color:#a58bff;}
.actwrap{display:flex;gap:6px;flex-wrap:wrap;}
.photo{max-width:560px;margin-left:auto;margin-right:auto;}
#viewerWrap{max-width:560px;margin-left:auto;margin-right:auto;}
.hero-viewer{max-width:none!important;}
.hero-viewer{animation:heroin 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--hero-delay,0s);}
.hero-copy>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--hero-delay,0s) + .15s);}
.hero-copy>*:nth-child(2){animation-delay:calc(var(--hero-delay,0s) + .25s);}
.hero-copy>*:nth-child(3){animation-delay:calc(var(--hero-delay,0s) + .35s);}
.hero-copy>*:nth-child(4){animation-delay:calc(var(--hero-delay,0s) + .45s);}
.hero-copy>*:nth-child(5){animation-delay:calc(var(--hero-delay,0s) + .55s);}
#intro{position:fixed;inset:0;z-index:300;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s ease,transform 1s cubic-bezier(.7,0,.2,1),filter .8s ease;cursor:pointer;overflow:hidden;}
#intro.done{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none;}
#intro .orb{position:absolute;width:min(90vw,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(90,167,255,.28),transparent 65%);animation:orb 2.4s ease-in-out both;}
#intro .ring{position:absolute;width:140px;height:140px;border-radius:50%;border:1px solid rgba(90,167,255,.5);opacity:0;animation:ring 2s ease-out .2s both;}
#intro .ring.r2{animation-delay:.7s;}
.il{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.2rem,10vw,4rem);display:flex;position:relative;letter-spacing:.02em;direction:ltr;}
.il span{opacity:0;transform:translateY(18px) scale(.96);filter:blur(8px);animation:letter .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*65ms + 250ms);}
.il .b{font-weight:700;}
.il .l{font-weight:400;color:#9aa0aa;}
.il::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 1.1s ease 1.1s forwards;mix-blend-mode:overlay;pointer-events:none;}
.iline{width:min(60vw,240px);height:1px;background:linear-gradient(90deg,transparent,#5aa7ff,transparent);transform:scaleX(0);animation:iline 1.2s ease .6s forwards;}
.itag{font-size:.78rem;color:#9aa0aa;opacity:0;animation:fadein .8s ease 1.25s forwards;letter-spacing:.06em;}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes orb{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:scale(1.15);opacity:.9}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes fadein{to{opacity:1}}
@keyframes iline{to{transform:scaleX(1)}}
@keyframes heroin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.filebtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.dropzone.filebtn{display:flex;width:100%;}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;}
.seg2{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:100px;padding:4px;width:max-content;margin:12px auto 0;}
.seg2 button{border:none;background:transparent;color:var(--ink-dim);padding:9px 20px;border-radius:100px;font-size:.82rem;cursor:pointer;touch-action:manipulation;}
.seg2 button.active{background:var(--ink);color:#0a0a0c;}
.vhint{text-align:center;font-size:.72rem;color:var(--ink-dim);margin-top:8px;}
.fb3d{width:100%;height:100%;object-fit:contain;animation:floaty 5s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<script>
(function(){
  var el=document.getElementById('intro'); if(!el) return;
  var seen=false; try{seen=sessionStorage.getItem('baiga_intro')==='1';}catch(e){}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(seen||reduce){ el.parentNode.removeChild(el); return; }
  var html=''; 'AMIR'.split('').forEach(function(c,i){ html+='<span class="b" style="--i:'+i+'">'+c+'</span>'; });
  html+='<span style="--i:4">&nbsp;</span>';
  'PHONE'.split('').forEach(function(c,i){ html+='<span class="l" style="--i:'+(5+i)+'">'+c+'</span>'; });
  el.querySelector('.il').innerHTML=html;
  window.__introDelay=2.1; document.documentElement.style.setProperty('--hero-delay','2.0s');
  document.body.classList.add('introlock');
  var closed=false;
  function close(){
    if(closed) return; closed=true;
    try{sessionStorage.setItem('baiga_intro','1');}catch(e){}
    el.classList.add('done'); document.body.classList.remove('introlock');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); document.documentElement.style.setProperty('--hero-delay','0s'); },1000);
  }
  el.addEventListener('click',close); setTimeout(close,2500);
})();
</script>

const SEED = readSeed();
function loadDB(){
  let raw = null;

    const base = raw || {orders:[],cart:[],wishlist:[],recentSearches:[],adminAuth:false};
    const used = {}; (base.coupons||[]).forEach(c=>{ used[c.code]=c.used||0; });

      products: JSON.parse(JSON.stringify(SEED.products)),
      categories: JSON.parse(JSON.stringify(SEED.categories)),
      coupons: (SEED.coupons||[]).map(c=>Object.assign({},c,{used:used[c.code]||0})),
      settings: Object.assign({}, SEED.settings),
      seedRev: SEED.rev, adminAuth:false
    });

  }

    raw = {
      products: seedProducts(),
      categories: seedCategories(),
      coupons: [

function saveDB(s){

    const payload={products:s.products||[],categories:s.categories||[],coupons:(s.coupons||[]).map(c=>Object.assign({},c,{used:0})),settings:s.settings||{}};
    window.__catalogSync=window.__catalogSync||Promise.resolve();

}

    window.amirSupabase.auth.onAuthStateChange((_event,s)=>{IS_OWNER=!!(s?.user?.email?.toLowerCase()===OWNER_EMAIL);OWNER_READY=true;const p=(location.hash.slice(1)||'/home').split('?')[0];if(p.startsWith('/admin'))render(true);});
  }catch(e){IS_OWNER=false;}
  OWNER_READY=true;
  const p=(location.hash.slice(1)||'/home').split('?')[0];if(p.startsWith('/admin')||p==='/account')render(true);

function catalogSnapshot(){
  return { products:state.products, categories:state.categories,
           coupons:state.coupons.map(c=>Object.assign({},c,{used:0})), settings:state.settings };
}
function hasUnpublished(){
  if(!SEED) return true;
  const a = JSON.stringify(catalogSnapshot());
  const b = JSON.stringify({products:SEED.products,categories:SEED.categories,coupons:(SEED.coupons||[]).map(c=>Object.assign({},c,{used:0})),settings:SEED.settings});
  return a!==b;
}
function publishPanel(){
  const dirty = hasUnpublished();
  return `<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;">
    <div style="min-width:220px;flex:1;">
      <div style="font-weight:600;font-size:.9rem;color:${dirty?'var(--warn)':'var(--good)'};">${dirty?'Unpublished changes':'Live site is up to date'}</div>
      <div style="font-size:.76rem;color:var(--ink-dim);margin-top:2px;">Customers see the catalog from the last publish. Changes you make here stay private until you publish.</div>
    </div>
    ${ART ? `<button class="btn primary" id="pubBtn" onclick="publishSite()" ${dirty?'':'disabled'}>Publish changes</button>` : `<div style="font-size:.76rem;color:var(--ink-dim);max-width:230px;">Open the published page in claude.ai to publish changes.</div>`}
  </div>`;
}
async function publishSite(){
  if(!IS_OWNER || !ART){ toast('Only the store owner can publish.','err'); return; }
  const btn = document.getElementById('pubBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Publishing…'; }
  try{
    const seed = Object.assign({rev:Date.now()}, catalogSnapshot());
    const json = JSON.stringify(seed).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    const b64 = document.getElementById('store-src').textContent.trim();
    const tpl = new TextDecoder().decode(Uint8Array.from(atob(b64), c=>c.charCodeAt(0)));
    const html = tpl.replace('@@'+'SEED@@', ()=>json).replace('@@'+'SRC@@', ()=>b64);
    await ART.publish(html);
  }catch(e){
    const code = e && e.code;
    if(code==='conflict') return;
    if(btn){ btn.disabled = false; btn.textContent = 'Publish changes'; }
    if(code==='not_writer'||code==='not_granted') toast('Only the store owner can publish.','err');
    else if(code==='too_large') toast('Too large — use smaller product images.','err');
    else toast('Publishing failed. Try again.','err');
  }
}
function ownerOnlyView(){ return `<div class="container"><div class="empty">This area is for the store owner only.<div><button class="btn primary" onclick="nav('/home')">Back home</button></div></div></div>`; }
const waNumber = ()=> String((state.settings&&state.settings.whatsapp)||'213667883670').replace(/\D/g,'');
function waLink(o){
  const ar = state.lang==='ar';
  const lines = o.items.map(i=>'• '+i.name+' ×'+i.qty+' — '+money(i.price*i.qty)).join('\n');
  const txt = (ar?'طلب جديد ':'New order ')+'#'+o.id+'\n'+lines+'\n'+(ar?'المجموع: ':'Total: ')+money(o.total)+'\n'
    +(ar?'الاسم: ':'Name: ')+o.customer.name+'\n'+(ar?'الهاتف: ':'Phone: ')+(o.customer.phone||'')+'\n'+(ar?'العنوان: ':'Address: ')+(o.customer.address||'')+', '+(o.customer.city||'');
  return 'https://wa.me/'+waNumber()+'?text='+encodeURIComponent(txt);
}

/* -------- derived helpers -------- */
const money = n => Math.round(n).toLocaleString('en-US') + ' ' + (state.lang==='ar' ? 'د.ج' : 'DA');
const pctOff = p => p.discountPrice ? Math.round((1 - p.discountPrice/p.price)*100) : 0;
const catCount = slug => state.products.filter(p=>p.visible && p.category===slug).length;
const catByProduct = p => state.categories.find(c=>c.slug===p.category);
const findProduct = slug => state.products.find(p=>p.slug===slug);
const visibleProducts = () => state.products.filter(p=>p.visible);
function stars(r){ const full = Math.round(r); return '★'.repeat(full) + '☆'.repeat(5-full) + ' <span class="mono" style="color:var(--ink-dim)">'+r.toFixed(1)+'</span>'; }
function stockLabel(p){
  if(p.stock<=0) return '<span style="color:var(--bad)">Out of stock</span>';
  if(p.stock<=5) return '<span style="color:var(--warn)">Only '+p.stock+' left</span>';
  return '<span style="color:var(--good)">In stock</span>';
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseHash(){
  const raw = location.hash.slice(1) || '/home';
  const [path, qs] = raw.split('?');
  return { path, params: new URLSearchParams(qs||'') };
}
function nav(hash){ location.hash = hash; }
function setTitle(t){ document.title = (t? t+' · ' : '') + (state.settings.storeName||'Amir Phone'); }

const routes = [];
function route(pattern, handler){ routes.push({pattern, handler}); }
function matchRoute(path){
  for(const r of routes){
    const pk = r.pattern.split('/').filter(Boolean);
    const pp = path.split('/').filter(Boolean);
    if(pk.length!==pp.length) continue;
    const params={}; let ok=true;
    for(let i=0;i<pk.length;i++){
      if(pk[i].startsWith(':')) params[pk[i].slice(1)]=decodeURIComponent(pp[i]);
      else if(pk[i]!==pp[i]){ ok=false; break; }
    }
    if(ok) return {handler:r.handler, params};
  }
  return null;
}

function errorView(){ return '<div class="container"><div class="empty">Something went wrong loading this page.<div><button class="btn primary" onclick="location.reload()">Reload</button></div></div></div>'; }
function render(keepScroll){
  const y = window.scrollY;
  const {path, params:qp} = parseHash();
  unmountViewer();
  if(keepScroll!==true) closeAllOverlays();
  if(path.startsWith('/admin')){
    const appEl = document.getElementById('app');
    if(!OWNER_READY){ appEl.innerHTML = '<div class="container"><div class="empty">Checking access…</div></div>'; return; }
    if(!IS_OWNER){ document.body.classList.remove('admin-mode'); appEl.innerHTML = ownerOnlyView(); return; }
    state.adminAuth = true;
    if(path==='/admin/login'){ nav('/admin'); return; }
  }
  document.body.classList.toggle('admin-mode', path.startsWith('/admin'));
  const m = matchRoute(path);
  const app = document.getElementById('app');
  try{
    app.innerHTML = m ? (m.handler(m.params, qp) || '') : notFoundView();
  }catch(err){ console.error(err); app.innerHTML = errorView(); }
  window.scrollTo(0, keepScroll===true ? y : 0);
  document.querySelectorAll('.bn-item').forEach(b=> b.classList.toggle('active', path.startsWith(b.dataset.nav.slice(1))));
  updateCartBadge();
  try{ afterRender(path, m&&m.params, qp); }catch(err){ console.error(err); }
}
window.addEventListener('hashchange', ()=>render());

const LOW_END = (navigator.hardwareConcurrency||8)<=4 || (navigator.deviceMemory||8)<=2;
function webglOK(){
  try{ if(typeof THREE==='undefined') return false; const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }catch(e){ return false; }
}
function fallbackViewer(container, pid){
  const p = state.products.find(x=>x.id===pid);
  container.innerHTML = '<img class="fb3d" src="'+(p ? pimg(p) : artUri('generic',0x5aa7ff))+'" alt="">';
}
function mountViewer(container, kind, hue, opts={}){
  unmountViewer();
  container.innerHTML = '';
  if(!webglOK()){ fallbackViewer(container, opts.pid); return; }
  try{ setupViewer(container, kind, hue, opts); }
  catch(e){ console.error(e); unmountViewer(); fallbackViewer(container, opts.pid); }
}
function setupViewer(container, kind, hue, opts={}){
  const w = container.clientWidth||300, h = container.clientHeight||300;
  const renderer = new THREE.WebGLRenderer({antialias:!LOW_END, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW_END ? 1.25 : 2));
  renderer.setSize(w,h);
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 50);
  const dist = opts.dist||4.6;
  camera.position.set(0,0,dist);
  scene.add(new THREE.AmbientLight(0xaab4c8,0.9));
  scene.add(new THREE.HemisphereLight(0xdfe8ff,0x1a2030,0.8));
  const front=new THREE.DirectionalLight(0xffffff,1.1); front.position.set(2,3,5); scene.add(front);
  const key=new THREE.PointLight(hue,2.6,30); key.position.set(3,3,4); scene.add(key);
  const rim=new THREE.PointLight(0xffffff,1.6,30); rim.position.set(-3,-1,-3); scene.add(rim);
  let group;
  try{ group = buildKindGroup(kind, hue); }
  catch(err){
    console.error('3D model build failed, using simple model', err);
    group = new THREE.Group();
    const sh = new THREE.Shape(), W=1.36,H=2.8,R=.24,x=-W/2,y=-H/2;
    sh.moveTo(x+R,y); sh.lineTo(x+W-R,y); sh.absarc(x+W-R,y+R,R,-Math.PI/2,0,false); sh.lineTo(x+W,y+H-R); sh.absarc(x+W-R,y+H-R,R,0,Math.PI/2,false);
    sh.lineTo(x+R,y+H); sh.absarc(x+R,y+H-R,R,Math.PI/2,Math.PI,false); sh.lineTo(x,y+R); sh.absarc(x+R,y+R,R,Math.PI,Math.PI*1.5,false);
    const geo = new THREE.ExtrudeGeometry(sh,{depth:.12,bevelEnabled:true,bevelThickness:.015,bevelSize:.014,bevelSegments:3,curveSegments:20});
    geo.translate(0,0,-.06);
    group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x7a1230,metalness:.8,roughness:.3})));
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(W-.13,H-.13),new THREE.MeshBasicMaterial({color:0x07080c})); scr.position.z=.09; group.add(scr);
    const isl = new THREE.Mesh(new THREE.PlaneGeometry(.36,.1),new THREE.MeshBasicMaterial({color:0x000000})); isl.position.set(0,H/2-.17,.092); group.add(isl);
  }
  scene.add(group);
  const drag = {active:false, x:0, rotY:0, targetRotY:0};
  const dom = renderer.domElement;
  dom.style.cursor='grab';
  const onDown = e=>{ drag.active=true; drag.x=e.clientX; dom.style.cursor='grabbing'; };
  const onMove = e=>{ if(!drag.active) return; drag.targetRotY += (e.clientX-drag.x)*0.012; drag.x=e.clientX; };
  const onUp = ()=>{ drag.active=false; dom.style.cursor='grab'; };
  let zoomTarget = dist;
  const onDbl = ()=>{ zoomTarget = zoomTarget>dist-0.5 ? dist-1.5 : dist; };
  dom.addEventListener('pointerdown', onDown); dom.addEventListener('dblclick', onDbl);
  window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  const intro = container.dataset.intro==='1';
  const t0 = performance.now() + (intro ? (window.__introDelay||0)*1000 : 0);
  let visible = true;
  const io = ('IntersectionObserver' in window) ? new IntersectionObserver(en=>{ visible = en[0].isIntersecting; }) : null;
  if(io) io.observe(container);
  const v = {renderer, scene, camera, container, dom, onDown, onMove, onUp, onDbl, io, raf:0};
  let zoom = dist;
  function loop(t){
    if(viewer!==v) return;
    v.raf = requestAnimationFrame(loop);
    if(document.hidden || !visible) return;
    const k = intro ? Math.min(1, Math.max(0, (performance.now()-t0)/1800)) : 1;
    const e = 1-Math.pow(1-k,3);

    zoom += (zoomTarget - zoom)*0.08;
    camera.position.z = zoom + (1-e)*2.6;
    group.scale.setScalar(0.72 + 0.28*e);
    group.rotation.y = t*0.00025 + drag.rotY + (1-e)*2.4;
    group.position.y = Math.sin(t*0.001)*0.08;
    renderer.render(scene,camera);
  }

  viewer = v;
  v.raf = requestAnimationFrame(loop);
}
function unmountViewer(){
  if(!viewer) return;
  const v = viewer; viewer = null;
  cancelAnimationFrame(v.raf);
  v.dom.removeEventListener('pointerdown', v.onDown); v.dom.removeEventListener('dblclick', v.onDbl);
  window.removeEventListener('pointermove', v.onMove); window.removeEventListener('pointerup', v.onUp); window.removeEventListener('pointercancel', v.onUp);

  if(v.renderer.forceContextLoss) v.renderer.forceContextLoss();
  if(v.dom.parentNode) v.dom.parentNode.removeChild(v.dom);
}
window.addEventListener('resize', ()=>{
  if(!viewer) return;
  const w=viewer.container.clientWidth, h=viewer.container.clientHeight;

const scrim = document.getElementById('scrim');
function openScrim(onClose){ scrim.classList.add('open'); scrim.onclick = onClose; document.body.classList.add('lock'); }
function closeAllOverlays(){
  document.getElementById('sheet').classList.remove('side-menu');

  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('modalRoot').classList.remove('open');
  scrim.classList.remove('open');
  document.body.classList.remove('lock');
}
function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}
function openModal(html){ document.getElementById('modalCard').innerHTML = html; document.getElementById('modalRoot').classList.add('open'); }
function closeModal(){ document.getElementById('modalRoot').classList.remove('open'); }
document.getElementById('modalRoot').addEventListener('click', e=>{ if(e.target.id==='modalRoot') closeModal(); });

function updateCartBadge(){
  const n = cartLines().reduce((a,l)=>a+l.qty,0);
  const b = document.getElementById('cartBadge');
  b.textContent = n; b.classList.toggle('hide', n===0);
}
function flyToCart(fromEl){
  const rect = fromEl.getBoundingClientRect();
  const cartRect = document.getElementById('cartBtn').getBoundingClientRect();
  const dot = document.createElement('div');
  dot.className='flyer';
  dot.style.left = rect.left+rect.width/2+'px'; dot.style.top = rect.top+rect.height/2+'px';
  document.body.appendChild(dot);
  requestAnimationFrame(()=>{
    dot.style.left = cartRect.left+cartRect.width/2+'px';
    dot.style.top = cartRect.top+cartRect.height/2+'px';
    dot.style.transform='scale(.3)'; dot.style.opacity='0.2';
  });
  setTimeout(()=>dot.remove(), 600);
}

function addToCart(id, qty=1, fromEl=null){
  const p = state.products.find(x=>x.id===id);
  if(!p || p.stock<=0){ toast('Out of stock','err'); return false; }
  const existing = state.cart.find(c=>c.productId===id);
  const already = existing? existing.qty : 0;
  if(already+qty > p.stock){ toast('Only '+p.stock+' items available.', 'err'); return false; }
  if(existing) existing.qty += qty; else state.cart.push({productId:id, qty});
  persist(); updateCartBadge();
  if(fromEl) flyToCart(fromEl);
  toast(p.name+' added to cart', 'ok');
  renderCartDrawer();
  return true;
}
function setCartQty(id, qty){
  const item = state.cart.find(c=>c.productId===id); if(!item) return;
  const p = state.products.find(x=>x.id===id);
  if(qty<=0){ state.cart = state.cart.filter(c=>c.productId!==id); }
  else if(qty>p.stock){ toast('Only '+p.stock+' available.', 'err'); return; }
  else item.qty = qty;
  persist(); updateCartBadge(); renderCartDrawer();
  if(location.hash.startsWith('#/cart')) render(true);
}
function cartLines(){
  return state.cart.map(c=>{
    const p = state.products.find(x=>x.id===c.productId);
    if(!p) return null;
    const unit = p.discountPrice||p.price;
    return {p, qty:c.qty, unit, total:unit*c.qty};
  }).filter(Boolean);
}
function cartSubtotal(){ return cartLines().reduce((a,l)=>a+l.total,0); }

  if(!lines.length){
    body.innerHTML = '<div class="empty">Your cart is empty.<div><button class="btn primary" onclick="closeAllOverlays();nav(\'/shop\')" style="margin-top:14px;">Browse products</button></div></div>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = lines.map(l=>`
    <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">
      <div class="swatch" style="width:56px;height:56px;border-radius:10px;${thumbBg(l.p)}flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.85rem;font-weight:500;">${pname(l.p)}</div>
        <div style="font-size:.75rem;color:var(--ink-dim);">${money(l.unit)} · ${l.p.brand}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
          <button class="btn sm ghost" onclick="setCartQty('${l.p.id}',${l.qty-1})">−</button>
          <span class="mono" style="min-width:16px;text-align:center;">${l.qty}</span>
          <button class="btn sm ghost" onclick="setCartQty('${l.p.id}',${l.qty+1})">+</button>
          <button class="btn sm" style="color:var(--bad);margin-left:auto;" onclick="setCartQty('${l.p.id}',0)">Remove</button>
        </div>
      </div>
    </div>`).join('');
  const sub = cartSubtotal();
  foot.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:.9rem;"><span style="color:var(--ink-dim)">Subtotal</span><b>${money(sub)}</b></div>
    <button class="btn primary block" onclick="closeAllOverlays();nav('/checkout')">Checkout</button>
    <button class="btn ghost block" style="margin-top:8px;" onclick="closeAllOverlays();nav('/cart')">View full cart</button>`;
}

function toggleWishlist(id, el){
  const i = state.wishlist.indexOf(id);
  if(i>-1) state.wishlist.splice(i,1); else state.wishlist.push(id);
  persist();
  if(el){ el.classList.toggle('active', i===-1); const svg = el.querySelector('svg'); if(svg) svg.setAttribute('fill', i===-1 ? 'currentColor' : 'none'); }
  else render(true);
}

function applyFiltersSort(list, qp){
  const q = qp.get('q'); const cat = qp.get('category'); const brand = qp.get('brand');
  const minP = qp.get('min'); const maxP = qp.get('max'); const rating = qp.get('rating');
  const sale = qp.get('sale'); const isNew = qp.get('new'); const sort = qp.get('sort')||'newest';
  let out = list.slice();
  if(q) out = out.filter(p=> [p.name,p.brand,p.category,p.sku,p.description].join(' ').toLowerCase().includes(q.toLowerCase()));
  if(cat) out = out.filter(p=>p.category===cat);
  if(brand) out = out.filter(p=>p.brand===brand);
  if(minP) out = out.filter(p=>(p.discountPrice||p.price) >= +minP);
  if(maxP) out = out.filter(p=>(p.discountPrice||p.price) <= +maxP);
  if(rating) out = out.filter(p=>p.rating >= +rating);
  if(sale) out = out.filter(p=>p.discountPrice);
  if(isNew) out = out.filter(p=>p.isNew);
  if(sort==='price-asc') out.sort((a,b)=>(a.discountPrice||a.price)-(b.discountPrice||b.price));
  else if(sort==='price-desc') out.sort((a,b)=>(b.discountPrice||b.price)-(a.discountPrice||a.price));
  else if(sort==='rating') out.sort((a,b)=>b.rating-a.rating);
  else if(sort==='discount') out.sort((a,b)=>pctOff(b)-pctOff(a));
  else if(sort==='popular') out.sort((a,b)=>b.reviewCount-a.reviewCount);
  else out.sort((a,b)=>b.createdAt-a.createdAt);
  return out;
}

function readSheetFilters(root, base){
  const qp = new URLSearchParams(base);
  const active = k => { const el = root.querySelector(`.fchip[data-k="${k}"][style]`); return el? el.dataset.v : null; };
  ['category','brand','rating'].forEach(k=>{ const v = active(k); if(v) qp.set(k,v); else qp.delete(k); });
  const min = root.querySelector('#fmin').value, max = root.querySelector('#fmax').value;
  min? qp.set('min',min) : qp.delete('min');
  max? qp.set('max',max) : qp.delete('max');
  root.querySelector('#fsale').checked ? qp.set('sale','1') : qp.delete('sale');
  root.querySelector('#fnew').checked ? qp.set('new','1') : qp.delete('new');
  return qp;
}

function applyCouponFromCart(){
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msg = document.getElementById('couponMsg');
  if(!code){ checkoutState.couponCode = null; msg.textContent=''; return; }
  const v = validateCoupon(code, cartSubtotal());
  if(!v.ok){ msg.style.color='var(--bad)'; msg.textContent = v.msg; return; }
  checkoutState.couponCode = code;
  msg.style.color='var(--good)'; msg.textContent='Coupon "'+code+'" will be applied at checkout.';
}

let checkoutState = { step:1, customer:{}, shipping:{method:'standard',cost:1300,eta:'3–5 days'}, payment:{method:'cod'}, couponCode:null };
const SHIP_OPTIONS = [
  {id:'standard', name:'Standard', eta:'3–5 business days', cost:1300},
  {id:'express', name:'Express', eta:'1–2 business days', cost:2500},
];
function couponDiscount(sub){
  if(!checkoutState.couponCode) return 0;
  const v = validateCoupon(checkoutState.couponCode, sub);
  if(!v.ok) return 0;
  const c = v.c;
  return c.type==='percent' ? sub*c.value/100 : Math.min(c.value, sub);
}
route('/checkout', ()=>{
  setTitle('Checkout');
  const lines = cartLines();
  if(!lines.length) return `<div class="container"><div class="empty">Your cart is empty.<div><button class="btn primary" onclick="nav('/shop')">Browse products</button></div></div></div>`;
  const sub = cartSubtotal();
  const shipCost = sub>FREE_SHIP ? 0 : (SHIP_OPTIONS.find(s=>s.id===checkoutState.shipping.method)||SHIP_OPTIONS[0]).cost;
  const disc = couponDiscount(sub);

  return `

      <button class="btn ghost" style="flex:1;" onclick="checkoutState.step=3;render();">Back</button>

function confirmOrder(){
  const btn = document.getElementById('confirmBtn');
  if(btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Placing order…';
  const lines = cartLines();
  for(const l of lines){
    const fresh = state.products.find(x=>x.id===l.p.id);
    if(!fresh || fresh.stock < l.qty){ toast('Sorry, "'+l.p.name+'" no longer has enough stock.', 'err'); btn.disabled=false; btn.textContent='Confirm order'; render(); return; }
  }
  const sub = cartSubtotal();
  const shipOpt = SHIP_OPTIONS.find(s=>s.id===checkoutState.shipping.method)||SHIP_OPTIONS[0];
  const shipCost = sub>FREE_SHIP ? 0 : shipOpt.cost;
  const disc = couponDiscount(sub);
  const total = Math.max(0, sub+shipCost-disc);
  const order = {
    id: 'BG'+Date.now().toString().slice(-8),
    items: lines.map(l=>({productId:l.p.id, name:l.p.name, qty:l.qty, price:l.unit})),
    customer: {...checkoutState.customer},
    shipping: {...checkoutState.shipping, name:shipOpt.name, eta:shipOpt.eta},
    payment: {method:checkoutState.payment.method, status: checkoutState.payment.method==='cod'?'pending':'pending'},
    coupon: disc>0 ? checkoutState.couponCode : null,
    subtotal:sub, shippingCost:shipCost, discount:disc, total,
    status:'Pending', createdAt:Date.now(),
  };
  lines.forEach(l=>{ const p = state.products.find(x=>x.id===l.p.id); p.stock -= l.qty; });
  if(disc>0){ const cc = state.coupons.find(x=>x.code===checkoutState.couponCode); if(cc) cc.used = (cc.used||0)+1; }
  state.orders.unshift(order);
  state.cart = [];
  checkoutState = { step:1, customer:{}, shipping:{method:'standard',cost:1300,eta:'3–5 days'}, payment:{method:'cod'}, couponCode:null };
  persist(); updateCartBadge();
  nav('/order/'+order.id);
}

function specRow(k,v){ return `<div class="spec-row" style="margin-bottom:8px;"><input placeholder="Label" class="spec-k" value="${k}"><input placeholder="Value" class="spec-v" value="${v}"></div>`; }
function addSpecRow(){ document.getElementById('pf_specs').insertAdjacentHTML('beforeend', specRow('','')); }

route('/admin/products/new', ()=>{ setTitle('Add product'); window.__adminImages=[]; return adminShell('/admin/products', productForm(null)); });
route('/admin/products/edit/:id', (params)=>{ const p = state.products.find(x=>x.id===params.id); window.__adminImages = ((p&&p.images)||[]).slice(); setTitle('Edit product'); return adminShell('/admin/products', productForm(p)); });
function saveProduct(id){
  const g = k=>document.getElementById(k).value;
  const name = g('pf_name').trim();
  if(!name){ toast('Product name is required.','err'); return; }
  const price = parseFloat(g('pf_price'));
  if(isNaN(price) || price<=0){ toast('Enter a valid price.','err'); return; }
  const dpRaw = g('pf_dp').trim(); const dp = dpRaw==='' ? null : parseFloat(dpRaw);
  if(dp!==null && (isNaN(dp) || dp<=0 || dp>=price)){ toast('Sale price must be lower than the price.','err'); return; }
  const stock = parseInt(g('pf_stock'),10);
  if(isNaN(stock) || stock<0){ toast('Enter a valid stock quantity.','err'); return; }
  const sku = clean(g('pf_sku')) || ('BG-'+Math.floor(Math.random()*9000+1000));
  if(state.products.some(p=>p.sku===sku && p.id!==id)){ toast('This SKU is already used by another product.','err'); return; }
  const rating = Math.min(5, Math.max(0, parseFloat(g('pf_rating'))||4.5));
  const specs = Array.from(document.querySelectorAll('#pf_specs .spec-row')).map(r=>[clean(r.querySelector('.spec-k').value), clean(r.querySelector('.spec-v').value)]).filter(x=>x[0]&&x[1]);
  const data = {
    name:clean(name), nameAr:clean(g('pf_namear')), descAr:clean(g('pf_descar')), brand:clean(g('pf_brand'))||'Baiga',
    category:g('pf_cat'), kind:g('pf_kind'), price, discountPrice:dp, stock, sku, rating,
    description:clean(g('pf_desc')), specs,
    featured:document.getElementById('pf_featured').checked, isNew:document.getElementById('pf_new').checked,
    visible:document.getElementById('pf_visible').checked, images: window.__adminImages.slice(),
  };
  const snap = JSON.stringify(state);
  if(id){
    Object.assign(state.products.find(x=>x.id===id), data);
  } else {
    const stamp = Date.now();
    data.id = 'pr_'+stamp;
    data.slug = slugify(name,'product')+'-'+String(stamp).slice(-4);
    data.reviewCount = 0; data.features = []; data.model3d = true; data.createdAt = stamp;
    state.products.push(data);
  }
  if(!persist()){ state = JSON.parse(snap); toast('Storage is full — use smaller images.','err'); return; }
  toast(id ? 'Product saved' : 'Product added','ok'); nav('/admin/products');
}

route('/admin/orders', ()=>{
  setTitle('Admin · Orders');

  return adminShell('/admin/orders', `
    <h1 style="font-size:1.3rem;margin:0 0 16px;">Orders</h1>
    <table class="dt"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody>
    ${state.orders.length?state.orders.map(o=>`<tr>
      <td data-label="Order" class="mono">#${o.id}</td>
      <td data-label="Customer">${o.customer.name}</td>
      <td data-label="Total">${money(o.total)}</td>
      <td data-label="Status"><select onchange="setOrderStatus('${o.id}',this.value)">${STATUSES.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td data-label="Payment"><select onchange="setOrderPayment('${o.id}',this.value)">${PSTATUSES.map(s=>`<option value="${s}" ${o.payment.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td data-label=""><button class="btn sm ghost" onclick="viewOrderModal('${o.id}')">View</button></td>
    </tr>`).join(''):'<tr><td colspan="6" style="color:var(--ink-dim);">No orders yet.</td></tr>'}
    </tbody></table>`);
});
function setOrderStatus(id,val){
  const o = state.orders.find(x=>x.id===id); const was = o.status; if(was===val) return;
  const prod = i=>state.products.find(x=>x.id===i.productId);
  if(val==='Cancelled'){ o.items.forEach(i=>{ const p=prod(i); if(p) p.stock += i.qty; }); }
  else if(was==='Cancelled'){
    if(o.items.some(i=>{ const p=prod(i); return p && p.stock < i.qty; })){ toast('Not enough stock to reactivate this order.','err'); render(true); return; }
    o.items.forEach(i=>{ const p=prod(i); if(p) p.stock -= i.qty; });
  }
  o.status = val; persist(); toast('Order updated','ok');
}
function setOrderPayment(id,val){ const o=state.orders.find(x=>x.id===id); o.payment.status=val; persist(); toast('Payment status updated','ok'); }
function viewOrderModal(id){
  const o = state.orders.find(x=>x.id===id);
  openModal(`<h3 style="margin:0 0 12px;font-size:1.1rem;">Order #${o.id}</h3>
    <div style="font-size:.85rem;color:var(--ink-dim);margin-bottom:10px;">${new Date(o.createdAt).toLocaleString()}</div>

    <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:.85rem;">
      <div>${o.customer.name} · ${o.customer.phone}</div>
      <div style="color:var(--ink-dim);">${o.customer.address}, ${o.customer.city}, ${o.customer.country}</div>
    </div>

}

/* =========================================================================
   AFTER-RENDER HOOKS (mount 3D viewers, wire per-page listeners)
   ========================================================================= */
function afterRender(path){
  document.querySelectorAll('[data-viewer]:not([data-lazy])').forEach(el=>{
    mountViewer(el, el.dataset.viewer, +el.dataset.hue, {pid: el.dataset.pid});
  });
  const openFilterBtn = document.getElementById('openFilter');
  if(openFilterBtn){
    openFilterBtn.addEventListener('click', ()=>{
      const qp = new URLSearchParams(parseHash().params);
      const html = filterSheetHtml(qp);
      openSheet('Filter', html, `<button class="btn ghost" style="flex:1;" id="resetF">Reset</button><button class="btn primary" style="flex:2;" id="applyF">Apply filters</button>`, ()=>{});
      bindFilterChips(document.getElementById('sheetBody'));
      document.getElementById('resetF').addEventListener('click', ()=>{
        const base = new URLSearchParams(); const cat = document.getElementById('ctxCat').value;
        if(cat) base.set('category',cat);
        closeAllOverlays(); location.hash = '#'+parseHash().path+(base.toString()?'?'+base.toString():'');
      });
      document.getElementById('applyF').addEventListener('click', ()=>{
        const newQp = readSheetFilters(document.getElementById('sheetBody'), parseHash().params);
        closeAllOverlays();
        location.hash = '#'+parseHash().path+(newQp.toString()?'?'+newQp.toString():'');
      });
    });
  }
  const sortSel = document.getElementById('sortSel');
  if(sortSel){ sortSel.addEventListener('change', ()=>{
    const qp = new URLSearchParams(parseHash().params); qp.set('sort', sortSel.value);
    location.hash = '#'+parseHash().path+'?'+qp.toString();
  }); }
  const fi = document.getElementById('pf_img');
  if(fi){
    const handle = async files=>{
      for(const f of files){ if(!f.type.startsWith('image/')) continue;
        if(window.__adminImages.length>=8){ toast('Maximum 8 images per product.','err'); break; }
        try{ window.__adminImages.push(await resizeImage(f)); }catch(e){ imgErr(e); } }
      refreshAdminImgPrev(); toast('Image added','ok');
    };
    fi.addEventListener('change', ()=>{ handle(Array.from(fi.files)); fi.value=''; });
    const cam = document.getElementById('pf_cam');
    if(cam) cam.addEventListener('change', ()=>{ handle(Array.from(cam.files)); cam.value=''; });
    document.onpaste = e=>{ const fl = Array.from((e.clipboardData&&e.clipboardData.files)||[]).filter(f=>f.type.indexOf('image/')===0); if(fl.length){ e.preventDefault(); handle(fl); } };
    const dz = document.getElementById('pf_drop');
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('over'); handle(Array.from(e.dataTransfer.files)); });
  }
  const pw = document.getElementById('photoWrap');
  if(pw){
    let sx=0;
    pw.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
    pw.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx)<40) return;
      const slug = parseHash().path.split('/')[2]; const p = findProduct(slug); if(!p || !p.images || p.images.length<2) return;
      const n = p.images.length; setMainImg(p.id, ((window.__imgIdx||0) + (dx<0?1:-1) + n) % n);
    });
  }
  const adminMenuBtn = document.getElementById('adminMenuBtn');
  if(adminMenuBtn){ adminMenuBtn.addEventListener('click', ()=>{
    document.getElementById('adminSidebar').classList.toggle('open');
  }); }
}

  [/^(\d+) products$/, (m,n)=>n+" منتج"],

  [/^Sorry, "(.+)" no longer has enough stock\.$/, (m,n)=>"عذراً، لم يعد \""+n+"\" متوفراً بالكمية المطلوبة."],
  [/^Requires a minimum order of (.+)\.$/, (m,n)=>"يتطلب حداً أدنى للطلب "+n+"."],
];
function trText(s){
  const t = s.trim(); if(!t) return s;
  let out = AR[t];
  if(!out){ for(const [re,fn] of AR_PATS){ const m = t.match(re); if(m){ out = fn.apply(null,m); break; } } }
  if(!out) return s;
  return s.replace(t, out);
}
const origText = new WeakMap();
function translateNode(node){
  if(state.lang!=='ar') return;
  if(node.nodeType===3){
    const r = trText(node.nodeValue);
    if(r!==node.nodeValue){ origText.set(node, node.nodeValue); node.nodeValue = r; }
  } else if(node.nodeType===1){
    if(node.tagName==='SCRIPT'||node.tagName==='STYLE') return;
    const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {acceptNode:t=>{ const pt=t.parentNode&&t.parentNode.tagName; return (pt==='SCRIPT'||pt==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
    let n; while((n = w.nextNode())){ const r = trText(n.nodeValue); if(r!==n.nodeValue){ origText.set(n, n.nodeValue); n.nodeValue = r; } }
    const els = node.querySelectorAll ? node.querySelectorAll('[placeholder]') : [];
    els.forEach(el=>{ const ph = el.getAttribute('placeholder'); const r = trText(ph); if(r!==ph){ el.dataset.phOrig = ph; el.setAttribute('placeholder', r); } });
    if(node.hasAttribute && node.hasAttribute('placeholder')){ const ph=node.getAttribute('placeholder'); const r=trText(ph); if(r!==ph){ node.dataset.phOrig=ph; node.setAttribute('placeholder',r); } }
  }
}
function restoreEnglish(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){ if(origText.has(n)){ n.nodeValue = origText.get(n); } }
  document.querySelectorAll('[data-ph-orig]').forEach(el=>{ el.setAttribute('placeholder', el.dataset.phOrig); });
}
new MutationObserver(muts=>{
  if(state.lang!=='ar') return;
  muts.forEach(m=> m.addedNodes.forEach(translateNode));
}).observe(document.body, {childList:true, subtree:true});

function applyLang(){
  const ar = state.lang==='ar';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';

  if(ar) translateNode(document.body); else restoreEnglish();
}

/* =========================================================================
   IMAGES — resize on upload so they fit in browser storage
   ========================================================================= */
function resizeImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error('type'));
    if(file.size > 15*1024*1024) return rej(new Error('size'));
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('read'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error('format'));
      img.onload = ()=>{
        const enc = (c,q)=>{
          let o = c.toDataURL('image/webp', q);
          if(o.indexOf('data:image/webp')!==0){
            const c2 = document.createElement('canvas'); c2.width=c.width; c2.height=c.height;
            const x = c2.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(c,0,0);
            o = c2.toDataURL('image/jpeg', q);
          }
          return o;
        };
        let out = '';
        for(const [max,q] of [[900,.82],[720,.72],[560,.62]]){
          const sc = Math.min(1, max/Math.max(img.width,img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1,Math.round(img.width*sc)); c.height = Math.max(1,Math.round(img.height*sc));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          out = enc(c,q);
          if(out.length < 220000) break;
        }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function quickPrice(id, v){
  const p = state.products.find(x=>x.id===id); const n = parseFloat(v);
  if(isNaN(n) || n<0){ toast('Enter a valid price.','err'); return; }
  p.price = n; persist(); toast('Price updated','ok');
}
function quickSale(id, v){
  const p = state.products.find(x=>x.id===id);
  if(v===''){ p.discountPrice = null; } else { const n = parseFloat(v); if(isNaN(n)||n<0){ toast('Enter a valid price.','err'); return; } p.discountPrice = n; }
  persist(); toast('Sale price updated','ok');
}
function quickStock(id, v){
  const p = state.products.find(x=>x.id===id); const n = parseInt(v,10);
  if(isNaN(n)||n<0){ toast('Enter a valid price.','err'); return; }
  p.stock = n; persist(); toast('Stock updated','ok');
}
async function changeProductImage(id, input){
  const f = input.files[0]; input.value=''; if(!f) return;
  try{
    const data = await resizeImage(f);
    const snap = JSON.stringify(state);
    const p = state.products.find(x=>x.id===id);
    p.images = [data].concat((p.images||[]).slice(1));
    if(!persist()){ state = JSON.parse(snap); toast('Storage is full — use smaller images.','err'); return; }
    toast('Image updated','ok'); render(true);
  }catch(e){ imgErr(e); }
}

function showTab(mode, id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  const vw = document.getElementById('viewerWrap'), pw = document.getElementById('photoWrap');
  document.getElementById('tabPhoto').classList.toggle('active', mode==='photo');
  document.getElementById('tabViewer').classList.toggle('active', mode==='viewer');
  document.getElementById('vhint').style.display = mode==='viewer' ? '' : 'none';
  if(mode==='viewer'){
    pw.classList.add('hide'); vw.classList.remove('hide');

    unmountViewer(); vw.classList.add('hide'); vw.innerHTML=''; pw.classList.remove('hide');
  }

function artUri(kind, hue){
  const k = kind+'|'+hue;
  if(!artCache[k]) artCache[k] = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(artSvg(kind,hue))));
  return artCache[k];
}
function pimg(p){ return (p.images && p.images[0]) ? p.images[0] : artUri(p.kind||'generic', hueFor(p)); }
function catBg(c){
  const p = visibleProducts().find(x=>x.category===c.slug);
  return p ? thumbBg(p) : 'background:linear-gradient(135deg,#141824,#1c2030);';
}

/* =========================================================================
   VALIDATION + SMALL HELPERS
   ========================================================================= */
function clean(s){ return String(s==null?'':s).trim().replace(/[<>"]/g, ch=>({'<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function slugify(s, fb){ const v = String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); return (v || fb || 'item') ; }
function imgErr(e){
  const m = e && e.message;
  toast(m==='size' ? 'Image is too large (max 15 MB).' : (m==='type'||m==='format') ? 'Unsupported image format. Use JPG, PNG or WEBP.' : 'Could not read image', 'err');
}
function validateCoupon(code, sub){
  const c = state.coupons.find(x=>x.code===code);
  if(!c || !c.active) return {ok:false, msg:'Invalid or expired coupon.'};
  if(c.expires && new Date(c.expires+'T23:59:59') < new Date()) return {ok:false, msg:'Invalid or expired coupon.'};
  if((c.used||0) >= (c.usageLimit||Infinity)) return {ok:false, msg:'This coupon has reached its usage limit.'};
  if(sub < c.minOrder) return {ok:false, msg:'Requires a minimum order of '+money(c.minOrder)+'.'};
  return {ok:true, c};
}
function applyCouponFromCheckout(){
  const code = document.getElementById('ck_coupon').value.trim().toUpperCase();
  if(!code){ checkoutState.couponCode = null; render(true); return; }
  const v = validateCoupon(code, cartSubtotal());
  if(!v.ok){ toast(v.msg, 'err'); return; }
  checkoutState.couponCode = code; toast('Coupon applied','ok'); render(true);
}
function storageMeter(){
  const kb = Math.round(JSON.stringify(state).length/1024);
  const pct = Math.min(100, Math.round(kb/50));
  return '<div style="margin:22px 0 16px;"><div style="font-size:.78rem;color:var(--ink-dim);margin-bottom:6px;">Storage used: <span class="mono">'+kb+' KB</span> / ~5,000 KB</div>'
    + '<div style="height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(pct>80?'var(--warn)':'var(--lume)')+';"></div></div></div>';
}
document.addEventListener('click', e=>{
  const sb = document.getElementById('adminSidebar');
  if(sb && sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('#adminMenuBtn')) sb.classList.remove('open');
});

document.getElementById('menuBtn').addEventListener('click', ()=>{
  const items = [
    ['#/home','Home'],['#/shop','Shop'],['#/categories','Categories'],

  const html = '<div style="display:grid;gap:8px;padding:4px 0;">'+items.map(([href,label])=>'<a href="'+href+'" class="btn ghost block" style="text-align:start;text-decoration:none;" onclick="closeAllOverlays()">'+label+' <span style="float:right;">›</span></a>').join('')+'</div>';
  document.getElementById('sheet').classList.add('side-menu');
  openSheet('Menu',html,'',()=>{});
});

applyLang();
(async function bootStore(){try{const {data,error}=await window.amirSupabase.from('store_state').select('payload').eq('id',1).maybeSingle();if(!error&&data?.payload&&Array.isArray(data.payload.products)&&data.payload.products.length){const p=data.payload;state.products=p.products;state.categories=p.categories||state.categories;state.coupons=p.coupons||state.coupons;state.settings=Object.assign({},state.settings,p.settings||{});saveDB(state);}}catch(e){console.warn('Using local catalog cache:',e);}render();})();
if(!STORAGE_OK) setTimeout(()=>toast('Private mode: changes will not be kept after closing the page.','err'),3000);
